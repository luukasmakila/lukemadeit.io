name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep main builds/deployments in one queue so an older, slower build
# cannot publish after a newer one. Superseded PR checks may be cancelled.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test asset paths and export checks
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Read GitHub Pages configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and verify static site
        env:
          # PRs validate the project-site subpath without requiring Pages access.
          # Deployments use the configured base path (empty for a custom domain).
          NEXT_PUBLIC_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}', github.event.repository.name) || steps.pages.outputs.base_path }}
        run: |
          npm run build:pages
          npm run typecheck
          npm run verify:pages
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
